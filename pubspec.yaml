name: farmly
description: "AI-powered crop disease detection for Maharashtra farmers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.3
  intl: any
  percent_indicator: ^4.2.5
  http: ^1.4.0
  http_parser: ^4.1.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
