name: farmly
description: "AI-powered crop disease detection for Maharashtra farmers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.3
  intl: any
  percent_indicator: ^4.2.5
  http: ^1.4.0
  http_parser: ^4.1.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  pdf: ^3.11.2
  printing: ^5.13.5
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
